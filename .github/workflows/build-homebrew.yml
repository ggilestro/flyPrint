name: Build Homebrew

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up local tap
        run: |
          brew tap-new flyprint/local
          TAP_DIR="$(brew --repository flyprint/local)/Formula"
          cp homebrew/flyprint.rb "$TAP_DIR/flyprint.rb"

      - name: Validate formula syntax
        # Reason: Full --strict --online audit requires a published bottle.
        # Just verify the formula is valid Ruby and parses correctly.
        run: |
          brew style flyprint/local/flyprint || true
          ruby -c homebrew/flyprint.rb

      - name: Upload formula
        uses: actions/upload-artifact@v4
        with:
          name: FlyPrint-Homebrew-Formula
          path: homebrew/flyprint.rb
