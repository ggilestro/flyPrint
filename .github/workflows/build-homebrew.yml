name: Build Homebrew

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up local tap and install
        run: |
          # Create a local tap so brew accepts our formula
          brew tap-new flyprint/local
          TAP_DIR="$(brew --repository flyprint/local)/Formula"
          cp homebrew/flyprint.rb "$TAP_DIR/flyprint.rb"
          brew install flyprint/local/flyprint
          flyprint --version

      - name: Upload formula
        uses: actions/upload-artifact@v4
        with:
          name: FlyPrint-Homebrew-Formula
          path: homebrew/flyprint.rb
