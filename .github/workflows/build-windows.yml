name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[windows,gui,build]"

      - name: Build with PyInstaller
        run: pyinstaller windows/flyprint.spec --distpath dist --workpath build/pyinstaller --noconfirm

      - name: Download SumatraPDF portable
        run: |
          mkdir -p dist/FlyPrint/SumatraPDF
          Invoke-WebRequest -Uri "https://www.sumatrapdfreader.com/dl/rel/3.5.2/SumatraPDF-3.5.2-64.exe" -OutFile "dist/FlyPrint/SumatraPDF/SumatraPDF.exe"
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc windows/flyprint.iss

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FlyPrint-Windows-Portable
          path: dist/FlyPrint/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FlyPrint-Windows-Installer
          path: Output/FlyPrint-Setup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/FlyPrint-Setup-*.exe
