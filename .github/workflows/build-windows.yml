name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[windows,gui,build]"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $spec = Join-Path $env:GITHUB_WORKSPACE "windows" "flyprint.spec"
          Write-Host "Spec file: $spec"
          Write-Host "Exists: $(Test-Path $spec)"
          pyinstaller $spec --distpath dist --workpath build\pyinstaller --noconfirm

      - name: Bundle SumatraPDF portable
        continue-on-error: true
        shell: pwsh
        run: |
          # Install SumatraPDF via Chocolatey, then copy the portable exe
          choco install sumatrapdf.install -y --no-progress
          $sumatra = "C:\Program Files\SumatraPDF\SumatraPDF.exe"
          if (Test-Path $sumatra) {
            New-Item -ItemType Directory -Force -Path dist\FlyPrint\SumatraPDF
            Copy-Item $sumatra dist\FlyPrint\SumatraPDF\SumatraPDF.exe
            Write-Host "Bundled SumatraPDF successfully"
          } else {
            Write-Host "WARNING: SumatraPDF not found after install. Skipping bundle."
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc windows\flyprint.iss

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FlyPrint-Windows-Portable
          path: dist/FlyPrint/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FlyPrint-Windows-Installer
          path: windows/Output/FlyPrint-Setup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/Output/FlyPrint-Setup-*.exe
